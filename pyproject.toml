[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentprobe"
version = "0.1.0"
description = "Red-teaming tool for AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "openai>=1.0.0", # For hosted provider
    "requests>=2.31.0" # For Ollama
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML"
]

[project.scripts]
agentprobe = "agentprobe.cli:app"

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true